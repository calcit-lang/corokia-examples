name: Upload

on:
  push:
    branches: [master, main]
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: calcit-lang/setup-calcit@v1.5.1
        with:
          version: "0.45.1"
          tools: calcit,caps
      - name: Install dependencies
        run: |
          set -euo pipefail
          corepack enable
          yarn install --immutable
          caps --ci --strict
          caps verify --toolchain
      - name: Validate Calcit
        run: |
          set -euo pipefail
          calcit edit format
          git diff --exit-code -- calcit.cirru
          calcit --check-only --all-defs
          calcit fix --workflow strict --verify
      - name: Select frontend path
        id: assets
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            prefix="${GITHUB_REPOSITORY}/pr/${PR_NUMBER}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
          else
            prefix="${GITHUB_REPOSITORY}/"
          fi
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "base=https://cos-sh.tiye.me/$prefix" >> "$GITHUB_OUTPUT"
      - name: Build frontend
        run: calcit js && yarn vite build --base="${{ steps.assets.outputs.base }}"
      - name: Upload and verify frontend
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: worktools/cos-upload-action@v1.3.0
        with:
          source-dir: dist
          bucket: ${{ secrets.COS_BUCKET }}
          region: ap-shanghai
          prefix: ${{ steps.assets.outputs.prefix }}
          public-base-url: ${{ steps.assets.outputs.base }}
          secret-id: ${{ secrets.COS_SECRET_ID }}
          secret-key: ${{ secrets.COS_SECRET_KEY }}
      - name: Deploy to server
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: Pendect/action-rsyncer@v2.0.0
        env:
          DEPLOY_KEY: ${{ secrets.rsync_private_key }}
        with:
          flags: '-avzr --progress'
          options: ''
          ssh_options: ''
          src: 'dist/*'
          dest: 'rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}'
